<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(420px, 95vw);
      padding: 20px;
      border-radius: 18px;
      background: #202938;
      box-shadow: 0 12px 30px #0003;
    }

    .display {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #f8fafc;
      color: #172033;
      font-size: 28px;
      text-align: right;
    }

    .mode {
      margin-bottom: 12px;
      color: white;
      text-align: right;
      font-size: 14px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    button {
      min-height: 54px;
      border: none;
      border-radius: 9px;
      background: #39465a;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.2);
    }

    .operator {
      background: #53657e;
    }

    .clear {
      background: #d94b4b;
    }

    .equals {
      background: #23875b;
    }

    .mode-button {
      background: #7256a8;
    }
  </style>
</head>

<body>
  <main class="calculator">
    <input
      id="display"
      class="display"
      type="text"
      placeholder="0"
      aria-label="Calculator display"
      autocomplete="off"
    >

    <div class="mode">
      Angle mode: <strong id="angleMode">DEG</strong>
    </div>

    <div class="buttons">
      <button class="clear" data-action="clear">AC</button>
      <button class="operator" data-action="backspace">DEL</button>
      <button class="operator" data-value="(">(</button>
      <button class="operator" data-value=")">)</button>
      <button class="mode-button" data-action="toggle-mode">DEG/RAD</button>

      <button data-value="sin(">sin</button>
      <button data-value="cos(">cos</button>
      <button data-value="tan(">tan</button>
      <button data-value="sqrt(">√</button>
      <button data-value="^">xʸ</button>

      <button data-value="ln(">ln</button>
      <button data-value="log(">log</button>
      <button data-value="abs(">abs</button>
      <button data-value="pi">π</button>
      <button data-value="e">e</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="%">mod</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="*">×</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>
      <button class="equals" data-action="calculate">=</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="operator" data-value="^2">x²</button>
      <button class="operator" data-value="*">×</button>
      <button class="operator" data-value="/">÷</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");
    const angleModeLabel = document.getElementById("angleMode");
    let useDegrees = true;

    function addToDisplay(value) {
      display.value += value;
      display.focus();
    }

    function calculate() {
      try {
        let expression = display.value.trim();

        if (!expression) return;

        // Convert calculator symbols to JavaScript operators.
        expression = expression
          .replaceAll("×", "*")
          .replaceAll("÷", "/")
          .replaceAll("^", "**");

        // Allow only numbers, basic operators, parentheses, and function names.
        if (!/^[0-9+\-*/().%a-zA-Z\s]*$/.test(expression)) {
          throw new Error("Invalid characters");
        }

        const toRadians = value =>
          useDegrees ? value * Math.PI / 180 : value;

        const functions = {
          sin: value => Math.sin(toRadians(value)),
          cos: value => Math.cos(toRadians(value)),
          tan: value => Math.tan(toRadians(value)),
          sqrt: Math.sqrt,
          log: Math.log10,
          ln: Math.log,
          abs: Math.abs,
          pi: Math.PI,
          e: Math.E
        };

        const names = Object.keys(functions);
        const values = Object.values(functions);

        const result = new Function(
          ...names,
          `"use strict"; return (${expression});`
        )(...values);

        if (!Number.isFinite(result)) {
          throw new Error("Math error");
        }

        display.value = Number(result.toPrecision(12)).toString();
      } catch {
        display.value = "Error";
      }
    }

    document.querySelector(".buttons").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === "clear") {
        display.value = "";
      } else if (action === "backspace") {
        display.value = display.value.slice(0, -1);
      } else if (action === "calculate") {
        calculate();
      } else if (action === "toggle-mode") {
        useDegrees = !useDegrees;
        angleModeLabel.textContent = useDegrees ? "DEG" : "RAD";
      } else if (value) {
        addToDisplay(value);
      }
    });

    // Keyboard support: Enter calculates, Escape clears, Backspace deletes.
    display.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Escape") {
        display.value = "";
      }
    });
  </script>
</body>
</html>
